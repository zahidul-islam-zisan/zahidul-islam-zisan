<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Zisan cyberpunk developer banner</title>
  <desc id="desc">Dark futuristic banner with neon cyan and purple lines, terminal motifs, and Zisan developer branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset="0.55" stop-color="#101024"/>
      <stop offset="1" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset="1" stop-color="#B14DFF"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#24314B" stroke-width="1" opacity=".55"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <path d="M0 48 H220 L250 18 H430 M1200 280 H1000 L970 310 H790" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".9"/>
  <path d="M0 270 H115 L145 240 H230 M1200 72 H1080 L1050 102 H980" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity=".65"/>
  <path d="M820 0 L710 340 M880 0 L770 340" stroke="#9D4EDD" stroke-width="1" opacity=".25"/>
  <g fill="#00F5FF" opacity=".85">
    <circle cx="88" cy="92" r="3"/><circle cx="1110" cy="230" r="3"/><circle cx="1040" cy="115" r="2"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="78" y="112" fill="#00F5FF" font-size="16" letter-spacing="4">[ SYSTEM ONLINE ]</text>
    <text x="74" y="194" fill="#F3F7FF" font-size="68" font-weight="700" letter-spacing="2" filter="url(#glow)">ZISAN<span fill="#00F5FF">.exe</span></text>
    <text x="80" y="232" fill="#B9C4D8" font-size="19" letter-spacing="2">FULL-STACK • BACKEND • AI AUTOMATION</text>
    <text x="82" y="282" fill="#9D4EDD" font-size="15">root@zistech:~$ build --purpose --automate --ship</text>
    <text x="1090" y="52" fill="#00F5FF" font-size="13" text-anchor="end">v1.0 // CYBERPUNK MODE</text>
  </g>
  <path d="M74 303 H470" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
</svg>
